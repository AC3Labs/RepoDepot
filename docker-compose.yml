# The Repo Depot server. Agents are installed on each machine separately
# (Machines -> Add machine gives you the one-line command).
services:
  repodepot:
    image: ghcr.io/ac3labs/repodepot:latest
    container_name: repodepot
    restart: unless-stopped
    ports:
      - "8470:8470"
    volumes:
      - repodepot_data:/data
    environment:
      TZ: UTC

volumes:
  repodepot_data:
