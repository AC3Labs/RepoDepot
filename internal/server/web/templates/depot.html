{{define "content"}}{{$d := .Data}}
<div x-data="depot({{json (index $d "Apps")}}, {{json (index $d "Machines")}}, {{json (index $d "View")}}, {{index $d "LastCheck"}})" x-init="start()">
  <div class="page-head">
    <div class="grow">
      <h1>My Depot</h1>
      <div class="sub">Everything you've installed from GitHub, on every machine.</div>
    </div>
    <div class="btn-group">
      <button class="btn need-member" @click="checkNow()" :disabled="checking">
        <span class="spinner" x-show="checking" x-cloak></span><span x-show="!checking">{{template "i-refresh"}}</span>
        <span x-text="checking ? 'Checking…' : 'Check for updates'"></span>
      </button>
      <a class="btn primary need-member" href="/discover">{{template "i-plus"}}Add software</a>
    </div>
  </div>

  <div class="stats">
    <div class="card stat"><div class="ico">{{template "i-box"}}</div><div><div class="v" x-text="apps.length"></div><div class="l">Installed</div></div></div>
    <div class="card stat"><div class="ico warn">{{template "i-up"}}</div><div><div class="v" x-text="apps.filter(a => a.update_available).length"></div><div class="l">Updates available</div></div></div>
    <div class="card stat"><div class="ico ok">{{template "i-server"}}</div><div><div class="v"><span x-text="machines.filter(m=>m.status==='online').length"></span><span class="muted" style="font-size:1rem" x-text="' / '+machines.length"></span></div><div class="l">Machines online</div></div></div>
    <div class="card stat"><div class="ico info">{{template "i-clock"}}</div><div><div class="v" style="font-size:1.05rem;padding:4px 0" x-text="lastCheckLabel()"></div><div class="l">Last update check</div></div></div>
  </div>

  <template x-if="apps.length===0">
    <div class="card empty">
      <img class="art" src="/static/icon.webp" alt="" width="120" height="120">
      <h3>Your depot is empty</h3>
      <p>Search GitHub, pick something you like, and install it on any of your machines.</p>
      <div class="mt"><a class="btn primary lg" href="/discover">{{template "i-compass"}}Discover software</a></div>
      <template x-if="machines.length===0"><p class="small mt">First, <a href="/machines">add a machine</a> to install onto.</p></template>
    </div>
  </template>

  <template x-if="apps.length>0">
    <div>
      <div class="toolbar">
        <div class="searchbox" style="max-width:300px;height:36px">{{template "i-search"}}<input x-model="q" placeholder="Filter" aria-label="Filter apps"></div>
        <select class="select" style="width:auto;height:36px" x-model="machine" aria-label="Machine">
          <option value="">All machines</option>
          <template x-for="m in machines" :key="m.id"><option :value="m.id" x-text="m.name"></option></template>
        </select>
        <div class="seg" role="tablist">
          <button :class="filter==='all'&&'on'" @click="filter='all'">All</button>
          <button :class="filter==='updates'&&'on'" @click="filter='updates'">Updates <span class="chip accent" x-show="updatable.length" x-text="updatable.length"></span></button>
          <button :class="filter==='problems'&&'on'" @click="filter='problems'">Problems</button>
        </div>
        <div class="spacer"></div>
        <label class="row small dim need-member" style="gap:7px;cursor:pointer"><input type="checkbox" class="check" :checked="allSelected()" @change="selectAll($event.target.checked)">Select all</label>
        <button class="btn sm need-member" :disabled="selectedUpdatable().length===0" :title="updateSelectedHint()" @click="updateIds(selectedUpdatable())">{{template "i-up"}}Update selected <span x-show="selectedUpdatable().length" x-text="'('+selectedUpdatable().length+')'"></span></button>
        <button class="btn sm primary need-member" :disabled="updatable.length===0" @click="updateAll()">{{template "i-up"}}Update all <span x-show="updatable.length" x-text="'('+updatable.length+')'"></span></button>
        <div class="seg">
          <button :class="view==='grid'&&'on'" @click="setView('grid')" title="Cards" aria-label="Cards">{{template "i-grid"}}</button>
          <button :class="view==='list'&&'on'" @click="setView('list')" title="List" aria-label="List">{{template "i-list"}}</button>
        </div>
      </div>

      <template x-if="shown.length===0"><div class="card empty"><h3>Nothing matches</h3><p>Try another filter.</p></div></template>

      <div class="apps" x-show="view==='grid'">
        <template x-for="a in shown" :key="a.id">
          <div class="card app-card" :class="{selected: selected[a.id], 'has-ribbon': a.update_available && !busy(a)}">
            <div class="update-ribbon" x-show="a.update_available && !busy(a)">Update</div>
            <input type="checkbox" class="check sel need-member" x-model="selected[a.id]" :aria-label="'Select '+a.name">
            <div class="row" style="gap:13px;padding-right:26px">
              <img class="logo m" :src="a.logo_url" alt="" loading="lazy" width="52" height="52" @error="$el.src='/static/icon.webp'">
              <div class="grow">
                <div class="name wrap-any"><a :href="'/apps/'+a.id" x-text="a.name"></a></div>
                <div class="tiny muted wrap-any" x-text="a.repo"></div>
              </div>
            </div>
            <div class="row wrap" style="gap:6px">
              <span class="chip"><span x-html="osIcon(a.machine_os)" style="display:inline-flex"></span><span x-text="a.machine_name"></span></span>
              <span class="chip" x-text="methodLabel(a.method)"></span>
              <span x-html="statusPill(a)"></span>
            </div>
            <div class="loc wrap-any" x-show="a.location||a.dir" x-text="a.location||a.dir"></div>
            <div class="ver">
              <span class="muted">{{template "i-tag"}}</span>
              <span class="wrap-any" x-text="a.installed_label||'—'" :title="a.installed_ref"></span>
              <template x-if="a.update_available"><span class="row" style="gap:6px"><span class="arrow">→</span><a :href="a.latest_url" target="_blank" rel="noopener" class="wrap-any" x-text="a.latest_label"></a></span></template>
            </div>
            <div class="progress" x-show="busy(a)" x-cloak><div></div></div>
            <div class="foot">
              <span class="tiny muted status" :class="a.check_error && 'bad-text'" x-text="a.check_error ? 'Check failed: '+a.check_error : 'Checked '+a.checked_ago"></span>
              <a class="btn sm" x-show="a.options.open_url" :href="a.options.open_url" target="_blank" rel="noopener">{{template "i-external"}}Open</a>
              <button class="btn sm primary need-member" x-show="a.update_available && !busy(a) && a.can_update" @click="updateOne(a)">{{template "i-up"}}Update</button>
              <button class="btn sm need-member" x-show="a.update_available && !a.can_update" @click="markUpdated(a)" title="You updated it yourself">{{template "i-check"}}Mark updated</button>
              <a class="btn sm" :href="'/apps/'+a.id">Details</a>
            </div>
          </div>
        </template>
      </div>

      <div class="card" x-show="view==='list'" style="overflow-x:auto">
        <table class="table">
          <thead><tr><th style="width:36px"></th><th>App</th><th>Machine</th><th class="hide-sm">Location</th><th>Version</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <template x-for="a in shown" :key="a.id">
              <tr>
                <td><input type="checkbox" class="check need-member" x-model="selected[a.id]"></td>
                <td><div class="row"><img class="logo s" :src="a.logo_url" alt="" loading="lazy" width="36" height="36" @error="$el.src='/static/icon.webp'"><div><a :href="'/apps/'+a.id" style="color:var(--text);font-weight:600" x-text="a.name"></a><div class="tiny muted" x-text="a.repo"></div></div></div></td>
                <td class="nowrap" x-text="a.machine_name"></td>
                <td class="hide-sm"><span class="mono tiny muted" x-text="a.location||a.dir"></span></td>
                <td class="small"><span x-text="a.installed_label||'—'"></span><template x-if="a.update_available"><span> <span style="color:var(--accent)">→</span> <span x-text="a.latest_label"></span></span></template></td>
                <td x-html="statusPill(a)"></td>
                <td class="nowrap" style="text-align:right"><a class="btn sm" x-show="a.options.open_url" :href="a.options.open_url" target="_blank" rel="noopener">Open</a> <button class="btn sm primary need-member" x-show="a.update_available && !busy(a) && a.can_update" @click="updateOne(a)">Update</button><button class="btn sm need-member" x-show="a.update_available && !a.can_update" @click="markUpdated(a)">Mark updated</button> <a class="btn sm" :href="'/apps/'+a.id">Details</a></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>
</div>
{{end}}
