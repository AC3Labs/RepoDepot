{{define "content"}}{{$d := .Data}}
<form class="card pad col" method="post" action="/forgot" style="gap:16px">
  <div><h2>Forgot your password?</h2><p class="muted small mt-s">Enter your email and we'll send you a link to choose a new one.</p></div>
  {{with index $d "Error"}}<div class="notice bad">{{template "i-alert"}}<div>{{.}}</div></div>{{end}}
  <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" required autofocus autocomplete="username"></div>
  <button class="btn primary lg">Send the link</button>
  <a class="small center" href="/login">Back to sign in</a>
</form>
{{end}}
