name: Release

# Pushing a tag vX.Y.Z.W (matching VERSION) builds everything here, from the
# tagged source, and publishes it:
#
#   ghcr.io/ac3labs/repodepot:<version> and :latest   the server image
#   a GitHub release with the agents, their manifest and the install scripts
#
# The agents carry signatures by The Repo Depot's release key (secret
# REPODEPOT_SIGNING_KEY); agents only install updates signed with it. Without
# the secret the release is still built, but servers can't push it to agents.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the tag matches VERSION
        id: version
        run: |
          v=$(cat VERSION)
          if [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION ($v)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: go vet ./...
      - run: go test -race ./...

      - name: Build the server and agents
        env:
          REPODEPOT_SIGNING_KEY: ${{ secrets.REPODEPOT_SIGNING_KEY }}
        run: |
          if [ -z "$REPODEPOT_SIGNING_KEY" ]; then
            echo "::warning::REPODEPOT_SIGNING_KEY isn't set: the agents are released unsigned, so servers can't push them as updates."
          fi
          sh scripts/build.sh

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dist
          file: dist/Dockerfile
          platforms: linux/amd64
          push: true
          # GHCR names must be lowercase.
          tags: |
            ghcr.io/ac3labs/repodepot:${{ steps.version.outputs.version }}
            ghcr.io/ac3labs/repodepot:latest

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # The release notes are this version's CHANGELOG section.
          awk -v v="$V" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          cp dist/repodepot dist/agents/repodepot-server-linux-amd64
          (cd dist/agents && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --title "The Repo Depot $V" --notes-file notes.md dist/agents/*
